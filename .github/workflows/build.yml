name: Build N strap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Nstrap.slnx -c Release
      - name: Check core behavior
        run: dotnet run --project tests/Nstrap.Checks -c Release --no-build
      - name: Publish portable Windows app
        run: >
          dotnet publish src/Nstrap.App/Nstrap.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/Nstrap-win-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nstrap-win-x64
          path: artifacts/Nstrap-win-x64/
          if-no-files-found: error
          retention-days: 14
